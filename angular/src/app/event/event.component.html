<div class="event-list-container">
  <h2 class="event-list-title">{{ '::Menu:Events' | abpLocalization }}</h2>
  <div *ngIf="events?.items?.length === 0" class="no-events">No events found.</div>
  <div class="event-list">
    <div *ngFor="let event of events?.items" class="event-card">
      <img *ngIf="event.imageURL" [src]="event.imageURL" alt="{{ event.name }}" class="event-image" />
      <div class="event-details">
        <h3 class="event-name">{{ event.name }}</h3>
        <div class="event-meta">
          <span class="event-date" *ngIf="event.date">📅 {{ event.date | date:'mediumDate' }}</span>
          <span class="event-location" *ngIf="event.location">📍 {{ event.location }}</span>
        </div>
        <div class="event-description">{{ event.description }}</div>
        <div class="event-info">
          <span class="event-price">💵 {{ event.price }}</span>
          <span class="event-quota">🎟️ Quota: {{ event.quota }}</span>
        </div>
        <div class="event-age-restriction" *ngIf="event.ageRestriction">
          <span class="age-restriction">🔞 Age Restricted</span>
        </div>
        <div class="event-actions mt-2">
          <button *abpPermission="'ABPTicketProject.User.EventsPurchase'" class="btn btn-sm btn-outline-primary me-2" (click)="purchase(event.id)">
            <i class="fa fa-edit"></i> {{ '::Menu:Purchase' | abpLocalization }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
.event-list-container {
  max-width: 900px;
  margin: 2rem auto;
  padding: 1rem;
}
.event-list-title {
  text-align: center;
  margin-bottom: 2rem;
  font-size: 2rem;
  font-weight: 600;
}
.no-events {
  text-align: center;
  color: #888;
  font-size: 1.2rem;
}
.event-list {
  display: flex;
  flex-wrap: wrap;
  gap: 2rem;
  justify-content: center;
}
.event-card {
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  overflow: hidden;
  width: 320px;
  display: flex;
  flex-direction: column;
  transition: box-shadow 0.2s;
}
.event-card:hover {
  box-shadow: 0 4px 24px rgba(0,0,0,0.16);
}
.event-image {
  width: 100%;
  height: 180px;
  object-fit: cover;
  background: #f5f5f5;
}
.event-details {
  padding: 1.2rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.event-name {
  font-size: 1.3rem;
  font-weight: 600;
  margin: 0 0 0.3rem 0;
}
.event-meta {
  font-size: 0.95rem;
  color: #666;
  display: flex;
  gap: 1.2rem;
}
.event-description {
  margin: 0.5rem 0;
  color: #444;
  min-height: 48px;
}
.event-info {
  display: flex;
  gap: 1rem;
  font-size: 0.98rem;
  color: #333;
  flex-wrap: wrap;
}
.event-age-restriction {
  color: #d32f2f;
  font-weight: 500;
  margin-top: 0.3rem;
}
.event-status {
  margin-top: 0.5rem;
  font-size: 0.98rem;
  font-weight: 500;
}
.event-status.active span {
  color: #388e3c;
}
.event-status.inactive span {
  color: #d32f2f;
}
</style>
