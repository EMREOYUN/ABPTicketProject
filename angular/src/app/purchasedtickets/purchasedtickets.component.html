<div class="event-list-container">
  <h2 class="event-list-title">{{ '::Menu:PurchasedTickets' | abpLocalization }} {{ getUsername() }}</h2>
  <div *ngIf="tickets?.length === 0" class="no-events">{{ '::Menu:NoTickets' | abpLocalization }}</div>
  <div class="event-list">
    <div *ngFor="let ticket of tickets" class="event-card">
      <img *ngIf="ticket.imageURL" [src]="ticket.imageURL" alt="{{ ticket.eventName }}" class="event-image" />
      <div class="event-details">
        <h3 class="event-name">{{ ticket.eventName }}</h3>
        <div class="event-meta">
          <span class="event-date" *ngIf="ticket.date">📅 {{ ticket.date | date:'mediumDate' }}</span>
          <span class="event-location" *ngIf="ticket.location">📍 {{ ticket.location }}</span>
        </div>
        <div class="event-description">{{ ticket.description }}</div>
        <div class="event-info">
          <span class="event-price">🆔 {{ ticket.ticketId }}</span>
        </div>
        <div class="event-status mt-2">
          <span class="event-status active">{{ '::Menu:Purchased' | abpLocalization }}</span>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
.event-list-container {
  max-width: 900px;
  margin: 2rem auto;
  padding: 1rem;
}
.event-list-title {
  text-align: center;
  margin-bottom: 2rem;
  font-size: 2rem;
  font-weight: 600;
}
.no-events {
  text-align: center;
  color: #888;
  font-size: 1.2rem;
}
.event-list {
  display: flex;
  flex-wrap: wrap;
  gap: 2rem;
  justify-content: center;
}
.event-card {
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  overflow: hidden;
  width: 320px;
  display: flex;
  flex-direction: column;
  transition: box-shadow 0.2s;
}
.event-card:hover {
  box-shadow: 0 4px 24px rgba(0,0,0,0.16);
}
.event-image {
  width: 100%;
  height: 180px;
  object-fit: cover;
  background: #f5f5f5;
}
.event-details {
  padding: 1.2rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.event-name {
  font-size: 1.3rem;
  font-weight: 600;
  margin: 0 0 0.3rem 0;
}
.event-meta {
  font-size: 0.95rem;
  color: #666;
  display: flex;
  gap: 1.2rem;
}
.event-description {
  margin: 0.5rem 0;
  color: #444;
  min-height: 48px;
}
.event-info {
  display: flex;
  gap: 1rem;
  font-size: 0.98rem;
  color: #333;
  flex-wrap: wrap;
}
.event-status {
  margin-top: 0.5rem;
  font-size: 0.98rem;
  font-weight: 500;
}
.event-status.active span {
  color: #388e3c;
}
</style>
