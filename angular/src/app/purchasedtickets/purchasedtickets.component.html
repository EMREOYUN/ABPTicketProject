<div class="event-list-container">
  <h2 class="event-list-title">{{ '::Menu:PurchasedTickets' | abpLocalization }} {{ getUsername() }}</h2>
  <div *ngIf="tickets?.length === 0" class="no-events">{{ '::Menu:NoTickets' | abpLocalization }}</div>
  <div class="event-list">
    <div *ngFor="let ticket of tickets" class="event-card">
      <img *ngIf="ticket.imageURL" [src]="ticket.imageURL" alt="{{ ticket.eventName }}" class="event-image" />
      <div class="event-details">
        <h3 class="event-name">{{ ticket.eventName }}</h3>
        <div class="event-meta">
          <span class="event-date" *ngIf="ticket.date">📅 {{ ticket.date | date:'mediumDate' }}</span>
          <span class="event-location" *ngIf="ticket.location">📍 {{ ticket.location }}</span>
        </div>
        <div class="event-description">{{ ticket.description }}</div>
        <div class="event-info">
          <span class="event-price">🆔 {{ ticket.ticketId }}</span>
        </div>
        <div class="event-status mt-2">
          <span class="event-status active">{{ '::Menu:Purchased' | abpLocalization }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
